<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaaS</title>
  </head>
  <body>
    <header>
      <h1>LaaS</h1>
      <span id="lab-title"></span>
      <span id="status"></span>
      <span id="timer"></span>
      <button id="extend" hidden>Extend time</button>
      <button id="stop" hidden>Stop lab</button>
    </header>

    <main id="catalog"></main>

    <main id="lab" hidden>
      <aside>
        <article id="step"></article>
        <nav>
          <button id="prev">Back</button>
          <span id="step-counter"></span>
          <button id="next">Next</button>
        </nav>
      </aside>
      <div id="terminal"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
